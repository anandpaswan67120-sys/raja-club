<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raja Club</title>
<style>
:root{--bg:#120508;--card:#1f0a10;--line:#5a1a26;--gold:#f5c542;--red:#d6213b;--text:#fff3e0;--mute:#c9a5ab;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#3a0b16,var(--bg) 60%);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 0 30px #d6213b44}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:6px}
.lang button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mute);font-size:14px}
.lang button.on{background:var(--gold);color:#2a1500;border-color:var(--gold)}
h1{margin:0 0 4px;text-align:center;color:var(--gold);font-size:28px}
.sub{text-align:center;color:var(--mute);margin:0 0 18px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);font-size:16px}
.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
label{display:block;margin:12px 0 5px;font-size:14px;color:var(--mute)}
input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#12060a;color:var(--text);font-size:16px}
#otp{text-align:center;font-size:28px;letter-spacing:10px}
.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:linear-gradient(#f5c542,#d99a12);color:#2a1500;font-size:18px;font-weight:700}
.link{background:none;border:0;color:var(--gold);font-size:15px;margin-top:12px;width:100%;padding:8px}
.link:disabled{color:var(--mute)}
.msg{margin-top:12px;min-height:20px;text-align:center;font-size:14px;color:#ff8a9a}
.msg.ok{color:#7be0a0}
.test{background:#2b1a05;border:1px dashed var(--gold);border-radius:10px;padding:10px;text-align:center;font-size:14px;margin-bottom:6px}
.test b{font-size:22px;letter-spacing:4px;color:var(--gold)}
.coin{font-size:42px;text-align:center;color:var(--gold);margin:8px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.top .sub{margin:0;text-align:left;font-size:15px;color:var(--text)}
.wallet{background:#12060a;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:6px 14px;font-size:18px;font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--gold);border-radius:14px;padding:16px 8px;text-align:center;color:#fff;font-size:17px;font-weight:700;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 0 14px #00000088}
.card i{display:none}
.art{width:100%;height:88px}
.card.wide{grid-column:1/3}
.menu{display:flex;justify-content:space-around;margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.menu button{background:none;border:0;color:var(--mute);font-size:13px;padding:6px 10px}
.menu button.on{color:var(--gold)}
.small{background:none;border:1px solid var(--line);color:var(--mute);margin-top:10px;width:100%;padding:10px;border-radius:10px;font-size:14px}
.pc{width:72px;height:104px;background:#fffdf5;border:1px solid #b8a46a;border-radius:9px;position:relative;color:#111;font-family:Georgia,serif;box-shadow:0 3px 8px #000a}
.pc b{position:absolute;top:5px;left:7px;font-size:22px}
.pc u{position:absolute;top:28px;left:7px;font-size:18px;text-decoration:none}
.pc em{position:absolute;bottom:6px;right:9px;font-size:44px;font-style:normal}
.pc.red{color:#c4122f}
.pc.back{background:repeating-linear-gradient(45deg,#8a1020 0 6px,#5a0a15 6px 12px);border:2px solid #f5c542}
.pc.sm{width:34px;height:48px;border-radius:5px}
.pc.sm b{font-size:12px;top:2px;left:3px}
.pc.sm u{font-size:10px;top:15px;left:3px}
.pc.sm em{font-size:20px;right:4px;bottom:2px}
.gtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.gb{width:auto;margin:0;padding:6px 14px}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.seat{background:#12060a;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:13px}
.seat.on{border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.seat.out{opacity:.4}
.mc{display:flex;justify-content:center;gap:3px;margin-top:6px}
.me{margin-top:14px;text-align:center;font-size:14px}
.mycards{display:flex;justify-content:center;gap:8px;margin:8px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btns button{padding:13px 4px;border-radius:10px;border:0;font-size:16px;font-weight:700;background:linear-gradient(#f5c542,#d99a12);color:#2a1500}
.btns button:disabled{opacity:.35}
.btns .pk{background:#7a0f22;color:#fff}
.btns .w2{grid-column:1/3}
.res{margin-top:10px;padding:10px;border-radius:10px;background:#2b1a05;border:1px solid var(--gold);text-align:center;font-weight:700}
.hn{color:var(--gold);font-size:14px}
.lg{text-align:center;color:var(--mute);font-size:14px;min-height:20px;margin-top:8px}
.pf{text-align:center}
.av{width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stats div{background:#12060a;border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center}
.stats b{display:block;color:var(--gold);font-size:16px}
.stats span{font-size:11px;color:var(--mute)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:13px}
.hrow b.w{color:#7be0a0}
.hrow b.l{color:#ff8a9a}
.hrow.me2{background:#2b1a05}
.abj{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0}
.zone{background:#12060a;border:2px solid var(--line);border-radius:12px;padding:8px;margin-top:8px}
.zone.won{border-color:var(--gold);box-shadow:0 0 14px var(--gold)}
.zt{display:flex;justify-content:space-between;font-size:17px;margin-bottom:6px;color:var(--gold)}
.zc{display:flex;align-items:center;min-height:50px}
.zc .pc{margin-left:-14px}
.zc .pc:first-child,.zc .cnt+.pc{margin-left:0}
.zone.won .zc .pc:last-child{border:2px solid var(--gold);box-shadow:0 0 10px var(--gold)}
.cnt{color:var(--mute);font-size:12px;margin-right:6px}
.chips{display:flex;gap:6px;margin-top:10px}
.chip{flex:1;padding:10px 0;border-radius:24px;border:2px dashed var(--gold);background:#2b1a05;color:var(--gold);font-weight:700;font-size:15px}
.chip.on{background:var(--gold);color:#2a1500}
.pc.md{width:100%;height:70px;border-radius:6px}
.pc.md b{font-size:15px;top:3px;left:4px}
.pc.md u{font-size:12px;top:19px;left:4px}
.pc.md em{font-size:26px;right:4px;bottom:2px}
.hand{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.hw{transition:transform .1s}
.hw.sel{transform:translateY(-8px)}
.hw.sel .pc{border:2px solid var(--gold);box-shadow:0 0 10px var(--gold)}
.piles{display:flex;justify-content:center;gap:28px;margin:10px 0}
.pile{text-align:center;font-size:12px;color:var(--mute)}
.pile .pc{margin:0 auto 4px}
.pile.hot .pc{box-shadow:0 0 14px var(--gold)}
.ingame>.lang,.ingame>h1,.ingame>.sub{display:none}
.ingame{padding:12px}
.pc.md2{width:52px;height:74px}
.pc.md2 b{font-size:16px}
.pc.md2 u{font-size:13px;top:20px}
.pc.md2 em{font-size:28px}
.hide{display:none}
</style>
</head>
<body>
<div class="box">
  <div class="lang">
    <button id="bHi" class="on" onclick="setLang('hi')">हिंदी</button>
    <button id="bEn" onclick="setLang('en')">English</button>
  </div>
  <h1>🎴 <span data-t="brand"></span></h1>
  <p class="sub" data-t="tag"></p>

  <div id="authView">
    <div class="tabs">
      <button id="tabLogin" class="on" onclick="show('login')" data-t="login"></button>
      <button id="tabReg" onclick="show('reg')" data-t="register"></button>
    </div>
    <div id="nameRow" class="hide">
      <label data-t="name"></label>
      <input id="name" data-p="namePh">
    </div>
    <label data-t="mobile"></label>
    <input id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210">
    <label data-t="pass"></label>
    <input id="pass" type="password" placeholder="******">
    <div id="passRow" class="hide">
      <label data-t="pass2"></label>
      <input id="pass2" type="password" placeholder="******">
    </div>
    <button class="go" id="goBtn" onclick="submitForm()"></button>
  </div>

  <div id="otpView" class="hide">
    <p class="sub" id="otpInfo"></p>
    <div class="test"><span data-t="testNote"></span><br><b id="testOtp"></b></div>
    <label data-t="enterOtp"></label>
    <input id="otp" type="tel" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
    <button class="go" onclick="verifyOtp()" data-t="verify"></button>
    <button class="link" id="resend" onclick="resendOtp()"></button>
    <button class="link" onclick="backToForm()" data-t="back"></button>
  </div>

  <div id="homeView" class="hide">
    <div class="top">
      <p class="sub" id="hello"></p>
      <div class="wallet">🪙 <span id="coins">0</span></div>
    </div>
    <div class="grid" id="gridBox">
      <div class="card" style="background:linear-gradient(135deg,#7a0f22,#d6213b)" onclick="openTP()"><i>🃏</i><span data-t="g1"></span></div>
      <div class="card" style="background:linear-gradient(135deg,#0b4a6e,#1b8fc4)" onclick="openAB()"><i>🎯</i><span data-t="g2"></span></div>
      <div class="card" style="background:linear-gradient(135deg,#3a1170,#7a3ad1)" onclick="openRM()"><i>♠️</i><span data-t="g3"></span></div>
      <div class="card" style="background:linear-gradient(135deg,#0f5a2a,#22a85a)" onclick="soon()"><i>🎰</i><span data-t="g4"></span></div>
      <div class="card wide" style="background:linear-gradient(135deg,#8a4a05,#e08a1a)" onclick="soon()"><i>✈️</i><span data-t="g5"></span></div>
    </div>
    <div id="panel" class="hide"></div>
    <div class="menu">
      <button class="on" onclick="tab('home')" data-t="mHome"></button>
      <button onclick="tab('profile')" data-t="mProfile"></button>
      <button onclick="tab('board')" data-t="mBoard"></button>
    </div>
    <button class="small" onclick="logout()" data-t="logout"></button>
  </div>

  <div id="gameView" class="hide"></div>
  <div id="abView" class="hide"></div>
  <div id="rmView" class="hide"></div>

  <div class="msg" id="msg"></div>
</div>

<script>
var T={
hi:{brand:'राजा क्लब',tag:'सिर्फ मनोरंजन के लिए • वर्चुअल कॉइन',login:'लॉगिन',register:'रजिस्टर',name:'आपका नाम',namePh:'जैसे: राज',mobile:'मोबाइल नंबर (10 अंक)',pass:'पासवर्ड (कम से कम 6 अक्षर)',pass2:'पासवर्ड दोबारा लिखिए',goLogin:'लॉगिन करें',goReg:'OTP भेजें',testNote:'टेस्ट मोड: असली SMS अभी नहीं जाता। आपका OTP:',enterOtp:'6 अंक का OTP लिखिए',verify:'OTP जाँचें',back:'← पीछे जाएँ',resendIn:'OTP दोबारा भेजें (',resendNow:'OTP दोबारा भेजें',coinsLbl:'आपके वर्चुअल कॉइन',logout:'लॉग आउट',g1:'तीन पत्ती',g2:'अंदर बाहर',g3:'रम्मी',g4:'कैसीनो',g5:'प्लेन गेम',mHome:'🏠 होम',mProfile:'👤 प्रोफ़ाइल',mBoard:'🏆 लीडरबोर्ड',soon:'यह गेम जल्द आ रहा है!',
eMobile:'सही 10 अंक का मोबाइल नंबर लिखिए',ePass:'पासवर्ड कम से कम 6 अक्षर का रखिए',eName:'अपना नाम लिखिए',eMatch:'दोनों पासवर्ड एक जैसे नहीं हैं',eExists:'यह नंबर पहले से रजिस्टर है। लॉगिन कीजिए',eNoUser:'यह नंबर रजिस्टर नहीं है। पहले रजिस्टर कीजिए',eWrong:'पासवर्ड गलत है',eOtp:'OTP गलत है, फिर से देखिए',eExpired:'OTP की अवधि खत्म हो गई। दोबारा भेजिए',sent:'OTP भेज दिया गया',otpTo:function(m){return m+' पर OTP भेजा गया है'},hello:function(n){return 'स्वागत है, '+n+' जी!'}},

};
var lang='hi',mode='login',pending=null,timer=null,left=0;
function store(k,v){try{if(v===undefined){return localStorage.getItem(k)}localStorage.setItem(k,v)}catch(e){return null}}
function getUsers(){try{return JSON.parse(store('users')||'{}')}catch(e){return {}}}
function say(t,ok){var m=document.getElementById('msg');m.textContent=t||'';m.className='msg'+(ok?' ok':'')}
function setLang(l){
  lang=l;store('lang',l);
  document.documentElement.lang=l;
  document.getElementById('bHi').className=l==='hi'?'on':'';
  document.getElementById('bEn').className=l==='en'?'on':'';
  document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=T[l][e.getAttribute('data-t')]});
  document.querySelectorAll('[data-p]').forEach(function(e){e.placeholder=T[l][e.getAttribute('data-p')]});
  document.getElementById('goBtn').textContent=mode==='reg'?T[l].goReg:T[l].goLogin;
  if(pending){document.getElementById('otpInfo').textContent=T[l].otpTo(pending.mobile);tick(true)}
  var s=store('session');if(s&&getUsers()[s]){document.getElementById('hello').textContent=T[l].hello(getUsers()[s].name)}if(typeof G!=='undefined'&&G&&G.on)renderG();if(typeof TAB!=='undefined'&&TAB!=='home')renderPanel();if(typeof AB!=='undefined'&&AB&&AB.on)renderAB();if(typeof RM!=='undefined'&&RM&&RM.on)renderRM();
  say('');
}
function show(m){
  mode=m;say('');
  document.getElementById('tabLogin').className=m==='login'?'on':'';
  document.getElementById('tabReg').className=m==='reg'?'on':'';
  document.getElementById('nameRow').className=m==='reg'?'':'hide';
  document.getElementById('passRow').className=m==='reg'?'':'hide';
  document.getElementById('goBtn').textContent=m==='reg'?T[lang].goReg:T[lang].goLogin;
}
async function hash(s){
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
}

hi:{title:'रम्मी',cards:'पत्ते',closed:'बंद ढेर',open:'खुला ढेर',draw:'आपकी बारी: बंद ढेर या खुले ढेर से अपना पत्ता उठाइए',disc:'एक पत्ता चुनिए और फेंकें दबाइए। अपने 13 पत्ते सही बन गए हों तो घोषित करें दबाइए',botp:'Rohit खेल रहा है...',discard:'फेंकें',declare:'घोषित करें',bad:'पत्ते अभी सही नहीं हैं। 13 पत्ते कम से कम 2 सीक्वेंस और बाकी सीक्वेंस या सेट में बँटे होने चाहिए',win:'🎉 आप जीत गए! +50 कॉइन',lose:'Rohit जीत गया, -50 कॉइन',again:'नया खेल (50)',lobby:'लॉबी',low:'कॉइन कम हैं',rule:'हर खिलाड़ी 50 कॉइन लगाता है, जीतने वाले को 100 मिलते हैं। सीक्वेंस = एक ही रंग के लगातार 3 या अधिक पत्ते। सेट = एक नंबर के 3 या 4 पत्ते। इस वर्ज़न में जोकर पत्ता नहीं है।'},
en:{title:'Rummy',cards:'cards',closed:'Closed pile',open:'Open pile',draw:'Your turn: take a card from the closed or open pile',disc:'Pick one card and tap Discard. If your 13 cards are ready, tap Declare',botp:'Rohit is playing...',discard:'Discard',declare:'Declare',bad:'Cards are not valid yet. 13 cards must split into at least 2 sequences and the rest sequences or sets',win:'🎉 You won! +50 coins',lose:'Rohit won, -50 coins',again:'New game (50)',lobby:'Lobby',low:'Not enough coins',rule:'Each player puts 50 coins, the winner gets 100. Sequence = 3 or more consecutive cards of one suit. Set = 3 or 4 cards of one number. No joker card in this version.'}};
function ra(c){return c.r===14?1:c.r}
function srt(h){return h.slice().sort(function(a,b){return a.s-b.s||ra(a)-ra(b)})}
function rmv(h,l){return h.filter(function(x){return l.indexOf(x)<0})}
function shf(a){return a.sort(function(){return Math.random()-.5})}
function mm(h,sq){
 if(!h.length)return sq>=2;
 var c=h[0],rs=h.slice(1),i,j,x,cur,need,same;
 same=rs.filter(function(y){return y.r===c.r});
 if(same.length>=2){
  for(i=0;i<same.length;i++)for(j=i+1;j<same.length;j++){if(mm(rmv(rs,[same[i],same[j]]),sq))return true}
  if(same.length>=3&&mm(rmv(rs,same.slice(0,3)),sq))return true;
 }
 cur=[c];need=ra(c)+1;
 for(;;){
  x=rs.filter(function(y){return y.s===c.s&&cur.indexOf(y)<0&&(ra(y)===need||(need===14&&y.r===14))})[0];
  if(!x)break;
  cur.push(x);need++;
  if(cur.length>=3&&mm(rmv(rs,cur.slice(1)),sq+1))return true;
 }
 if(c.r===14){
  cur=[c];need=13;
  for(;;){
   x=rs.filter(function(y){return y.s===c.s&&cur.indexOf(y)<0&&y.r===need})[0];
   if(!x)break;
   cur.push(x);need--;
   if(cur.length>=3&&mm(rmv(rs,cur.slice(1)),sq+1))return true;
  }
 }
 return false;
}
function use(h,c){var n=0;h.forEach(function(x){if(x===c)return;if(x.r===c.r)n++;if(x.s===c.s&&Math.abs(ra(x)-ra(c))<=2)n++});return n}
function rmDraw(){if(!RM.deck.length){var top=RM.open.pop();RM.deck=shf(RM.open);RM.open=[top]}return RM.deck.pop()}
function openRM(){
 if(coins()<50){say(RT[lang].low);return}
 say('');addCoins(-50);
 document.getElementById('homeView').className='hide';
 document.getElementById('rmView').className='';gv(1);
 newRM();
}
function newRM(){
 clearTimeout(RTM);
 var d=mk(),i;
 RM={on:true,phase:'draw',sel:-1,me:[],bot:[],open:[],msg:'',w:null};
 for(i=0;i<13;i++){RM.me.push(d.pop());RM.bot.push(d.pop())}
 RM.open=[d.pop()];RM.deck=d;RM.me=srt(RM.me);
 renderRM();
}
function rmAgain(){if(coins()<50){say(RT[lang].low);return}say('');addCoins(-50);newRM()}
function rmPick(f){
 if(!RM.on||RM.phase!=='draw')return;
 var c=f==='o'?RM.open.pop():rmDraw();
 if(!c)return;
 RM.me=srt(RM.me.concat([c]));RM.sel=-1;RM.phase='discard';RM.msg='';renderRM();
}
function rmSel(i){if(RM.phase!=='discard')return;RM.sel=RM.sel===i?-1:i;RM.msg='';renderRM()}
function rmDiscard(){
 if(RM.phase!=='discard'||RM.sel<0)return;
 RM.open.push(RM.me.splice(RM.sel,1)[0]);RM.sel=-1;RM.phase='bot';RM.msg='';renderRM();
 RTM=setTimeout(rmBot,1200);
}
function rmDeclare(){
 if(RM.phase!=='discard'||RM.sel<0)return;
 var t=RM.me.slice(),d=t.splice(RM.sel,1)[0];
 if(mm(srt(t),0)){RM.me=t;RM.open.push(d);RM.sel=-1;rmEnd('me')}else{RM.msg='bad';renderRM()}
}
function rmBot(){
 if(!RM.on||RM.phase!=='bot')return;
 var o=RM.open[RM.open.length-1],c,i,t,d,wi=0,ws=99;
 if(o&&use(RM.bot,o)>=2)c=RM.open.pop();else c=rmDraw();
 RM.bot.push(c);
 for(i=0;i<RM.bot.length;i++){t=RM.bot.slice();d=t.splice(i,1)[0];if(mm(srt(t),0)){RM.bot=t;RM.open.push(d);rmEnd('bot');return}}
 RM.bot.forEach(function(x,k){var u=use(RM.bot,x);if(u<ws){ws=u;wi=k}});
 RM.open.push(RM.bot.splice(wi,1)[0]);
 RM.phase='draw';renderRM();
}
function rmEnd(w){RM.phase='done';RM.w=w;var won=w==='me';if(won)addCoins(100);rec(won?50:-50,won,'rm');renderRM()}
function closeRM(){
 clearTimeout(RTM);
 if(RM.on&&RM.phase!=='done')rec(-50,false,'rm');
 RM.on=false;
 document.getElementById('rmView').className='hide';gv(0);
 document.getElementById('homeView').className='';
 say('');
}
function mdC(c){return cardH(c).replace('class="pc','class="pc md')}
function renderRM(){
 var t=RT[lang],h='',ph=RM.phase,top=RM.open[RM.open.length-1],ok=ph==='discard'&&RM.sel>=0;
 h+='<div class="gtop"><button class="small gb" onclick="closeRM()">←</button><b>'+t.title+'</b><div class="wallet">🪙 <span class="gcn">'+coins()+'</span></div></div>';
 h+='<div class="seat"><div>👤 Rohit • '+RM.bot.length+' '+t.cards+'</div>'+(ph==='done'&&RM.w==='bot'?'<div class="hand">'+srt(RM.bot).map(mdC).join('')+'</div>':'')+'</div>';
 h+='<div class="piles"><div class="pile'+(ph==='draw'?' hot':'')+'" data-f="c" onclick="rmPick(this.dataset.f)">'+cardH(null)+t.closed+' ('+RM.deck.length+')</div><div class="pile'+(ph==='draw'?' hot':'')+'" data-f="o" onclick="rmPick(this.dataset.f)">'+(top?cardH(top):'<div class="pc" style="opacity:.2"></div>')+t.open+'</div></div>';
 h+='<div class="hand">'+RM.me.map(function(c,i){return '<div class="hw'+(RM.sel===i?' sel':'')+'" data-i="'+i+'" onclick="rmSel(Number(this.dataset.i))">'+mdC(c)+'</div>'}).join('')+'</div>';
 if(ph==='done'){
  h+='<div class="res">'+(RM.w==='me'?t.win:t.lose)+'</div><div class="btns"><button onclick="rmAgain()">'+t.again+'</button><button class="pk" onclick="closeRM()">'+t.lobby+'</button></div>';
 }else{
  h+='<div class="btns"><button class="pk" '+(ok?'':'disabled')+' onclick="rmDiscard()">'+t.discard+'</button><button '+(ok?'':'disabled')+' onclick="rmDeclare()">'+t.declare+'</button></div><div class="lg">'+(RM.msg==='bad'?t.bad:(ph==='draw'?t.draw:(ph==='discard'?t.disc:t.botp)))+'</div>';
 }
 h+='<div class="hn" style="text-align:center;font-size:12px;margin-top:8px">'+t.rule+'</div>';
 document.getElementById('rmView').innerHTML=h;
}
function gv(on){var b=document.querySelector('.box');if(b)b.classList.toggle('ingame',!!on);window.scrollTo(0,0);try{document.documentElement.scrollTop=0;document.body.scrollTop=0}catch(e){}}
function soon(){say(T[lang].soon,true)}
function newOtp(){return String(Math.floor(100000+Math.random()*900000))}
async function submitForm(){
  var t=T[lang];
  var mobile=document.getElementById('mobile').value.trim();
  var pass=document.getElementById('pass').value;
  if(!/^[6-9]\d{9}$/.test(mobile)){say(t.eMobile);return}
  if(pass.length<6){say(t.ePass);return}
  var users=getUsers();
  var h=await hash(pass);
  if(mode==='reg'){
    var name=document.getElementById('name').value.trim();
    if(!name){say(t.eName);return}
    if(pass!==document.getElementById('pass2').value){say(t.eMatch);return}
    if(users[mobile]){say(t.eExists);return}
    pending={name:name,mobile:mobile,hash:h,otp:newOtp(),exp:Date.now()+300000};
    showOtp();
  }else{
    var u=users[mobile];
    if(!u){say(t.eNoUser);return}
    if(u.hash!==h){say(t.eWrong);return}
    store('session',mobile);enter(mobile);
  }
}
function showOtp(){
  document.getElementById('authView').className='hide';
  document.getElementById('otpView').className='';
  document.getElementById('otpInfo').textContent=T[lang].otpTo(pending.mobile);
  document.getElementById('testOtp').textContent=pending.otp;
  document.getElementById('otp').value='';
  left=30;tick(true);say(T[lang].sent,true);
}
function tick(first){
  var b=document.getElementById('resend');
  clearInterval(timer);
  function draw(){
    if(left>0){b.disabled=true;b.textContent=T[lang].resendIn+left+')'}
    else{b.disabled=false;b.textContent=T[lang].resendNow}
  }
  draw();
  timer=setInterval(function(){left--;draw();if(left<=0)clearInterval(timer)},1000);
}
function resendOtp(){
  pending.otp=newOtp();pending.exp=Date.now()+300000;
  document.getElementById('testOtp').textContent=pending.otp;
  document.getElementById('otp').value='';
  left=30;tick();say(T[lang].sent,true);
}
function verifyOtp(){
  var t=T[lang];
  if(!pending)return;
  if(Date.now()>pending.exp){say(t.eExpired);return}
  if(document.getElementById('otp').value.trim()!==pending.otp){say(t.eOtp);return}
  var users=getUsers();
  users[pending.mobile]={name:pending.name,hash:pending.hash,coins:1000};
  store('users',JSON.stringify(users));
  store('session',pending.mobile);
  var m=pending.mobile;pending=null;clearInterval(timer);
  enter(m);
}
function backToForm(){
  pending=null;clearInterval(timer);say('');
  document.getElementById('otpView').className='hide';
  document.getElementById('authView').className='';
}
function enter(mobile){
  var u=getUsers()[mobile];
  document.getElementById('authView').className='hide';
  document.getElementById('otpView').className='hide';
  document.getElementById('homeView').className='';
  document.getElementById('hello').textContent=T[lang].hello(u.name);tab('home');
  document.getElementById('coins').textContent=u.coins;
  say('');
}
function logout(){
  try{localStorage.removeItem('session')}catch(e){}
  document.getElementById('homeView').className='hide';
  document.getElementById('authView').className='';
  document.getElementById('pass').value='';
  show('login');
}
lang=store('lang')==='en'?'en':'hi';
setLang(lang);show('login');
var s=store('session');
if(s&&getUsers()[s]){enter(s)}
</script>
